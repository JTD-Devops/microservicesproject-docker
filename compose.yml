version: "3.9"

services:
  devopsdb:
    image: devikadockhub/mydockerproject:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 2
    networks:
      - mynetwork

  application:
    image: devikadockhub/mydockerproject:app
    ports:
      - "8080:8080"
    deploy:
      replicas: 2
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
